default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: format
        name: format
        entry: make fmt
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: clippy
        name: clippy
        entry: nix develop -c make clippy
        language: system
        pass_filenames: false
        types: [rust]
        stages: [pre-commit]
      - id: test-changed
        name: make test-changed
        entry: make test-changed
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: cargo-audit
        name: make cargo-audit
        entry: make cargo-audit
        language: system
        pass_filenames: false
        stages: [pre-push]
