---
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: cargo
    directory: /helpers/cloister-dbus-validate
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: cargo
    directory: /helpers/cloister-netns
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: cargo
    directory: /helpers/cloister-pipewire-validate
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: cargo
    # Scan the workspace once so member manifests share one lockfile update.
    directory: /helpers/cloister-sandbox
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: cargo
    directory: /helpers/cloister-seccomp-filter
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: cargo
    directory: /helpers/cloister-seccomp-validate
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: cargo
    directory: /helpers/cloister-wayland-validate
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: nix
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
